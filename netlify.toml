[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; upgrade-insecure-requests"

[[redirects]]
  from = "/post/2014/the-invisible-helper/"
  to = "/writing/from-code-completion-to-architecture/"
  status = 301
  force = true

[[redirects]]
  from = "/post/2014/the-turtle-story/"
  to = "/writing/building-an-ai-visual-story/"
  status = 301
  force = true

[[redirects]]
